
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiko Baba Kuş Oyunu</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #18264a;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #ffe66d; }

#game {
  position: relative;
  width: min(400px, 96vw);
  height: 570px;
  margin: auto;
  overflow: hidden;
  background: linear-gradient(#55c9ff, #d4f5ff);
  border: 4px solid white;
  border-radius: 15px;
  touch-action: manipulation;
}

#bird {
  position: absolute;
  left: 75px;
  top: 230px;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  overflow: hidden;
  z-index: 3;
  border: 3px solid #9c5a23;
  background: #ffdb83;
}

#bird img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.pipe {
  position: absolute;
  width: 66px;
  background: #22b84b;
  border: 4px solid #11652c;
  border-radius: 5px;
}

.pipe.top { top: 0; }
.pipe.bottom { bottom: 18px; }

.pipe::after {
  content: "";
  position: absolute;
  left: -7px;
  width: 72px;
  height: 22px;
  background: #35d65c;
  border: 4px solid #11652c;
  border-radius: 5px;
}

.pipe.top::after { bottom: -3px; }
.pipe.bottom::after { top: -3px; }

#score {
  position: absolute;
  top: 12px;
  width: 100%;
  font-size: 38px;
  font-weight: bold;
  color: white;
  text-shadow: 2px 3px #333;
  z-index: 5;
  pointer-events: none;
}

#ground {
  position: absolute;
  bottom: 0;
  height: 18px;
  background: #9c672e;
  border-top: 6px solid #56d34f;
  width: 100%;
  z-index: 4;
}

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #102044bb;
  z-index: 8;
  padding: 20px;
}

#overlay h2 { font-size: 30px; }

button {
  padding: 13px 25px;
  border: 0;
  border-radius: 12px;
  background: #ffe34f;
  color: #222;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
}

.info {
  color: #dbeafe;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>😂 HİKO BABA KUŞ</h1>
<p>Dokun, zıpla, borulardan kaç!</p>

<div id="game">
  <div id="score">0</div>

  <div id="bird">
    <img
      src="https://avatars.mds.yandex.net/get-vthumb/3413951/464c31769489b9322ea1d76a4f949b4d/564x318_1"
      alt="Hiko Baba"
      onerror="this.style.display='none';this.parentElement.innerText='😂';"
    >
  </div>

  <div id="ground"></div>

  <div id="overlay">
    <h2>HİKO BABA 😂</h2>
    <p>Dokununca zıpla ve DRİİİ sesini çıkar!</p>
    <button id="start">OYUNA BAŞLA</button>
  </div>
</div>

<p class="info">Kontrol: Ekrana dokun veya SPACE tuşuna bas.</p>
<p>🏆 Rekor: <span id="best">0</span></p>

<script>
const game = document.getElementById("game");
const bird = document.getElementById("bird");
const scoreEl = document.getElementById("score");
const overlay = document.getElementById("overlay");

let y, velocity, pipes, score, playing, lastTime;
let best = 0;
let audioCtx;

function sound() {
  try {
    audioCtx = audioCtx ||
      new (window.AudioContext || window.webkitAudioContext)();

    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(650, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
      150, audioCtx.currentTime + 0.22
    );

    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.01, audioCtx.currentTime + 0.23
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.23);
  } catch (e) {}
}

function jump() {
  if (!playing) return;
  velocity = -390;
  sound();
}

function makePipe(x) {
  const gap = 180;
  const topH = 65 + Math.random() * 245;

  const top = document.createElement("div");
  top.className = "pipe top";
  top.style.height = topH + "px";

  const bottom = document.createElement("div");
  bottom.className = "pipe bottom";
  bottom.style.height =
    (game.clientHeight - topH - gap - 18) + "px";

  game.append(top, bottom);

  pipes.push({
    x, topH, gap, top, bottom, passed: false
  });
}

function startGame() {
  document.querySelectorAll(".pipe").forEach(p => p.remove());

  pipes = [];
  y = 220;
  velocity = 0;
  score = 0;
  playing = true;
  lastTime = 0;

  scoreEl.textContent = "0";
  bird.style.top = y + "px";
  bird.style.transform = "rotate(0deg)";

  overlay.style.display = "none";

  makePipe(game.clientWidth + 40);
  requestAnimationFrame(loop);
}

function endGame() {
  playing = false;

  if (score > best) best = score;
  document.getElementById("best").textContent = best;

  overlay.innerHTML = `
    <h2>OYUN BİTTİ 😂</h2>
    <p>Puanın: ${score}</p>
    <button id="again">TEKRAR OYNA</button>
  `;

  overlay.style.display = "flex";
  document.getElementById("again").onclick = startGame;
}

function loop(time) {
  if (!playing) return;

  const dt = Math.min((time - (lastTime || time)) / 1000, 0.03);
  lastTime = time;

  velocity += 1000 * dt;
  y += velocity * dt;

  bird.style.top = y + "px";
  bird.style.transform =
    `rotate(${Math.max(-25, Math.min(40, velocity / 10))}deg)`;

  if (y < 0 || y + 64 > game.clientHeight - 18) {
    endGame();
    return;
  }

  pipes.forEach(p => {
    p.x -= 145 * dt;
    p.top.style.left = p.x + "px";
    p.bottom.style.left = p.x + "px";

    const bx = 75, bw = 48, bh = 48;
    const overlapX = bx + bw > p.x && bx < p.x + 66;

    if (overlapX && (y < p.topH || y + bh > p.topH + p.gap)) {
      endGame();
      return;
    }

    if (!p.passed && p.x + 66 < bx) {
      p.passed = true;
      score++;
      scoreEl.textContent = score;
    }
  });

  if (!playing) return;

  pipes = pipes.filter(p => {
    if (p.x < -80) {
      p.top.remove();
      p.bottom.remove();
      return false;
    }
    return true;
  });

  if (pipes.length === 0 ||
      pipes[pipes.length - 1].x < game.clientWidth - 210) {
    makePipe(game.clientWidth + 20);
  }

  requestAnimationFrame(loop);
}

game.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  jump();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

document.getElementById("start").onclick = startGame;
</script>

</body>
</html>
